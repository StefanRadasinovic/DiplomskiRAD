<div class="motor-card" (click)="onCardClick()"> 
  <h4><b>{{ motor.producers[0].name }} - {{ motor.name }}</b></h4>
  <img [src]="getImage()" alt="{{ motor.name }}" class="motor-img">
  <h4><b><p>{{ motor.displayPriceOnly && motor.displayPriceOnly.length > 0 ? motor.displayPriceOnly[0].price + '$' : 'Bez_Cene' }}</p></b></h4>
</div>
