<mat-toolbar color="primary" class="mat-elevation-z6">
    <span><mat-icon>eco</mat-icon>Diplomski</span>
  
    <div class="spacer"></div>
 

  <a mat-button class="nav-button" *ngIf="userRole != 'ROLE_NOTAUTH'" [routerLink]="['/users', userId]"><span>Profile</span></a>
  <a mat-button class="nav-button" *ngIf="userRole != 'ROLE_NOTAUTH'"  routerLink="/all-motorcycles"><span>Motorcycles</span></a>
  <a mat-button class="nav-button" *ngIf="userRole != 'ROLE_NOTAUTH'"  routerLink="/all-equipments"><span>Equipment</span></a>

  <a mat-button class="nav-button" *ngIf="userRole === 'DIREKTOR'" routerLink="/director-homepage"><span>Direktor Homepage</span></a>
  <a mat-button class="nav-button" *ngIf="userRole === 'DIREKTOR'" routerLink="/all-users"><span>Users</span></a>
  <a mat-button class="nav-button" *ngIf="userRole === 'DIREKTOR'" routerLink="/add-workers"><span>Add Worker</span></a>
  <a mat-button class="nav-button" *ngIf="userRole === 'DIREKTOR'" routerLink="/adjust-prices"><span>Adjust Prices</span></a>
  <a mat-button class="nav-button" *ngIf="userRole === 'DIREKTOR'" routerLink="/all-pendingOrders"><span>Orders</span></a>
  <a mat-button class="nav-button" *ngIf="userRole === 'DIREKTOR'" [routerLink]="['/display-services', userId]"><span>Services</span></a>

 
  <a mat-button  class="nav-button" *ngIf="userRole === 'RADNIK'" routerLink="/worker-homepage"><span>Radnik Homepage</span></a>


  <a mat-button  class="nav-button" *ngIf="userRole === 'KLIJENT'" routerLink="/client-homepage"><span>Klijent Homepage</span></a>
  <a mat-button  class="nav-button" *ngIf="userRole === 'KLIJENT'" [routerLink]="['/all-orders', userId]"><span>Orders</span></a>
  <a mat-button  class="nav-button" *ngIf="userRole === 'KLIJENT'" [routerLink]="['/all-service', userId]"><span>Services</span></a>



  <a mat-button class="nav-button" routerLink="register" *ngIf="userRole === 'ROLE_NOTAUTH'"><span>Register</span></a>  
  <a mat-raised-button color="accent" class="nav-button" routerLink="login" *ngIf="userRole === 'ROLE_NOTAUTH'" >Login</a>
  <a mat-raised-button color="warn" class="nav-button" *ngIf="userRole != 'ROLE_NOTAUTH'" (click)="logout() " >Logout</a>
  
  
</mat-toolbar>
