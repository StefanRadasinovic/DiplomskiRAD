<div class="container">
    <div class="filter-group">
      <input type="text" class="filter-input" [(ngModel)]="name" placeholder="Search by Name">
      <input type="text" class="filter-input" [(ngModel)]="surname" placeholder="Search by Surname">
      <div class="dropdown">
        <select [(ngModel)]="status" class="filter-select">
          <option value="">Select Status</option>
          <option value="NA_CEKANJU">NA_CEKANJU</option>
          <option value="U_TOKU">U_TOKU</option>
          <option value="ZAVRSEN">ZAVRSEN</option>
          <option value="ODBIJEN">ODBIJEN</option>
        </select>
      </div>

      <button mat-raised-button id="search" color="primary" class="search-button" (click)="filterByNameAndSurname()">Search</button>
    </div>
  
    <div class="content-wrapper">
    <table class="user-table" *ngIf="!isLoading">
      <thead>
        <tr>
          <th>Name</th>
          <th>Surname</th>
          <th>End Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let task of tasks; let i = index" [class.active]="currentIndex === i" (click)="setActiveOrders(task, i)">

            <td>{{ task.workerInfo.name || '-' }}</td>
            <td>{{ task.workerInfo.surname || '-' }}</td>
            <td>{{ task.endDateTask || '-' }}</td>
            <td>{{ task.status }}</td>
          </tr>
      </tbody>
    </table>
  
        <div *ngIf="isLoading" class="loading">
        </div>
  
  
        <!---Get TaskById-->
        <div class="form-wrapper" *ngIf="currentItem">
          <h4 class="form-title">Task Info</h4>
          <hr />
      
          <h3 [ngClass]="getStatusClass(displayForTasks.status)">Status: {{ displayForTasks.status }}</h3>
          
      
      
          <div class="form-group-inline">
            <div class="form-group-inline-item">
              <label class="form-custom ">Worker Name:</label>
              <input type="text" value="{{  displayForTasks.workerInfo.name  }}" readonly  />
            </div>
            <div class="form-group-inline-item">
              <label  class="form-custom ">Worker Surname:</label>
              <input type="text" value="{{ displayForTasks.workerInfo.surname  }}" readonly />
            </div>
          </div>

          <br>

          <div class="form-group">
            <label class="form-label">Task Description:</label>
            <textarea value="{{displayForTasks.taskDescription }}" readonly></textarea>
          </div>
      
      
          <br>

          <div class="form-group" *ngIf="displayForTasks.status === 'ODBIJEN'">
            <label class="form-label">Rejection Reason:</label>
            <textarea value="{{displayForTasks.razlogOdbijanja }}" readonly></textarea>
          </div>

          <br>

          <div class="form-group" *ngIf="displayForTasks.status === 'ZAVRSEN'">
            <label class="form-label">End Date:</label>
            <input type="text" value="{{displayForTasks.endDateTask}}"readonly />
          </div>

          <br>

          <div class="form-group" *ngIf="displayForTasks.status === 'ZAVRSEN'">
            <label class="form-label">Spare parts:</label>
            <input type="text" value="{{displayForTasks.sparePartInfo[0].name || '-'}}"readonly />
          </div>

          <br>

          <div class="form-group" *ngIf="displayForTasks.status === 'ZAVRSEN'">
            <label class="form-label">Amount:</label>
            <input type="text" value="{{displayForTasks.sparePartInfo[0].amount}}"readonly />
          </div>
    
      
          <br>
  
          <div mat-dialog-actions class="button-container">
            <button *ngIf="displayForTasks.status === 'ODBIJEN' || displayForTasks.status === 'NA_CEKANJU'" mat-raised-button id="editMotor" color="primary" class="edit-button" (click)="assignNewWorker(displayForTasks.id)">Assign new Worker <mat-icon>add</mat-icon> </button>
          </div>
          
    </div>
  </div>
