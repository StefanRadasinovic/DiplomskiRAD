<div class="form-wrapper" *ngIf="!loading; else loadingTemplate">
    <h4 class="form-title">User Info</h4>
    <hr />
  
    <!-- Form Group for Name -->
    <div class="form-group">
      <label class="form-label">Name:</label>
      <input type="text" value="{{ user.name }}" readonly />
    </div>
  
    <br>
  
    <!-- Form Group for Surname -->
    <div class="form-group">
      <label class="form-label">Surname:</label>
      <input type="text" value="{{ user.surname }}" readonly />
    </div>
  
    <br>
  
    <!-- Form Group for Username -->
    <div class="form-group">
      <label class="form-label">Username:</label>
      <input type="text" value="{{ user.username }}" readonly />
    </div>
  
    <br>
  
    <!-- Form Group for Role -->
    <div class="form-group" *ngIf="isDisplayWorker(user) || isDisplayDirector(user)">
      <label class="form-label">Role:</label>
      <input type="text" value="{{ user.role }}" readonly />
    </div>
  
    <br>
  
  
    <div *ngIf="isDisplayWorker(user)">
      <label class="form-label">Number Of Tasks:</label>
      <input type="text" value="{{ user.numOfTasks }}" readonly />
    </div>
  
   
    <div *ngIf="isDisplayWorker(user) || isDisplayDirector(user)">
      <label class="form-label">Salary($):</label>
      <input type="text" value="{{ user.salary }}" readonly />
    </div>
  

    <div *ngIf="isDisplayClient(user)">
      <label class="form-label">Number Of Purchases:</label>
      <input type="text" value="{{ user.numOfPurchases }}" readonly />
    </div>
  
    <br>
  
    <!-- Edit and Delete Buttons -->
    <div mat-dialog-actions class="button-container">
      <button mat-raised-button id="editUser" color="primary" class="edit-button" (click)="editUser(user.id)">
        Edit<mat-icon>edit</mat-icon>
      </button>
    </div>
  </div>
  
  <ng-template #loadingTemplate>
    <p>Loading user details...</p>
  </ng-template>
