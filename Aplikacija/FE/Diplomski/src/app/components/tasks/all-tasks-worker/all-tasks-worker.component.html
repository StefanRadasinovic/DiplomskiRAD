<div class="container">
    <div class="filter-group">
      <input type="text" class="filter-input" [(ngModel)]="taskDescription" placeholder="Search by Task">
      <div class="dropdown">
        <select [(ngModel)]="status" class="filter-select">
          <option value="">Select Status</option>
          <option value="U_TOKU">U_TOKU</option>
          <option value="NA_CEKANJU">NA_CEKANJU</option>
        </select>
      </div>

      <button mat-raised-button id="search" color="primary" class="search-button" (click)="filterByNameAndSurname()">Search</button>
    </div>
  
    <div class="content-wrapper">
    <table class="user-table" *ngIf="!isLoading">
      <thead>
        <tr>
          <th>Task Description</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let service of tasks; let i = index" [class.active]="currentIndex === i" (click)="setActiveOrders(service, i)">
            <td>
              {{ service.taskDescription || 'N/A' }}
            </td>
            <td>
              {{ service.status|| 'N/A' }}
            </td>
          </tr>
      </tbody>
    </table>
  
        <div *ngIf="isLoading" class="loading">
        </div>
  
  
        <!---Get OrderById-->
        <div class="form-wrapper" *ngIf="currentItem">
          <h4 class="form-title">Task Info</h4>
          <hr />
      
          <h3 [ngClass]="getStatusClass(displayForTasks.status)">Status: {{ displayForTasks.status }}</h3>
          
      
      
          <div class="form-group">
            <label class="form-label">Task Description:</label>
            <textarea value="{{displayForTasks.taskDescription}}" readonly></textarea>
          </div>
        
      
        <br>
  
          <div mat-dialog-actions class="button-container">
            <button *ngIf="displayForTasks.status === 'NA_CEKANJU'" mat-raised-button id="editMotor" color="primary" class="edit-button" (click)="handleAccept()">Accept <mat-icon>check</mat-icon> </button>
            <button *ngIf="displayForTasks.status === 'U_TOKU'" mat-raised-button id="aMotor" color="primary" class="edit-button" (click)="handleFinish()">Complete <mat-icon>add</mat-icon> </button>
            <button  *ngIf="displayForTasks.status === 'NA_CEKANJU' || displayForTasks.status === 'U_TOKU'" mat-raised-button id="deleteMotor" color="primary" class="delete-button" (click)="handleDecline()">Decline <mat-icon>close</mat-icon></button>
          </div>
    </div>
  </div>
