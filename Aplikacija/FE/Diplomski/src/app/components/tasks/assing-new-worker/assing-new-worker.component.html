<div class="form-wrapper">
  <form [formGroup]="taskForm" (ngSubmit)="handleSubmit()" class="task-form">
    <h4 class="form-title">Assign new Worker</h4>
    <hr />

    <!-- Worker selection -->
    <div class="form-group">
      <label class="form-label">Worker:</label>
      <select formControlName="userId" required>
        <option *ngFor="let user of users" [value]="user.id">{{ user.name }} {{ user.surname }}</option>
      </select>
    </div>

    <br>

    <div class="form-action">
      <button type="submit" [disabled]="!taskForm.valid" class="submit-button">Assign</button>
    </div>
  </form>

  <p>{{ createMessage }}</p>
</div>
