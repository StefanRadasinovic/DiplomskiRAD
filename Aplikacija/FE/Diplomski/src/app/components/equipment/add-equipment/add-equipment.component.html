<div class="form-wrapper">
    <form [formGroup]="equipmentForm" (ngSubmit)="handleSubmit()" class="motor-form">
      <h4 class="form-title">Dodaj Dodatnu Opremu</h4>
      <hr />
  
      <br>
      
      <!-- Form Group for Name -->
      <div class="form-group">
        <label for="name" class="form-label">Naziv:</label>
        <input id="name" type="text" formControlName="name" required />
      </div>

      <br>

      <div class="form-group">
        <div formArrayName="producers">
          <div *ngFor="let producer of producers.controls; let i = index" [formGroupName]="i">
            <div class="form-group">
              <label for="producer-{{i}}-name" class="form-label">Proizvodjac:</label>
              <input id="producer-{{i}}-name" type="text" formControlName="name" required />
            </div>
          </div>
        </div>
      </div>
  
    <br>

    <div class="form-group">
        <label for="amount" class="form-label">Kolicina:</label>
        <input id="amount" type="number" formControlName="amount" onkeyup="if(this.value<=0)this.value=1" onblur="if(this.value<=0)this.value=1" required />
    </div>

  <br>

  <div class="form-group">
    <label for="equipmentState" class="form-label">Stanje:</label>
    <select id="equipmentState" formControlName="equipmentState" required>
      <option value="NOVA">NOVA</option>
      <option value="POLOVNA">POLOVNA</option>
    </select>
  </div>

<br>
  
    <label for="slika" class="form-label">Slika:</label>
    <div class="drop-zone" 
       #dropZone
       (dragover)="onDragOver($event)" 
       (drop)="onDrop($event)" 
       (click)="fileInput.click()">
      <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" hidden />
      <br>
      <mat-icon class="large-icon">cloud_upload</mat-icon>
      <p class="upload-text">Drag and drop a picture here, or click to upload</p>
      <img *ngIf="imagePreview" [src]="imagePreview" alt="Image Preview" class="image-preview" />
  </div>

  <br>

  <div formArrayName="producers">
    <div *ngFor="let producer of producers.controls; let i = index" [formGroupName]="i">
      <div class="form-group">
        <label for="producer-{{i}}-description" class="form-label">Opis:</label>
        <textarea id="producer-{{i}}-description" formControlName="description" required></textarea>
      </div>
    </div>
  </div>
  
  
      <!-- Submit Button -->
      <div class="form-action">
        <button type="submit" [disabled]="equipmentForm.invalid" class="submit-button">Potvrdi</button>
      </div>
  
      <!-- Message -->
      <p>{{ createMessage }}</p>
    </form>
  </div>
